<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Evecord</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' evecord:; style-src 'self' 'unsafe-inline' evecord:; script-src 'self' 'unsafe-inline'" />
    <link rel="stylesheet" href="common.css" />
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            user-select: none;
            -webkit-app-region: drag;
        }

        .card {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            border-radius: 14px;
            border: 1px solid color-mix(in srgb, var(--fg) 22%, transparent);
            background: var(--bg);
            color: var(--fg);
        }

        img {
            width: 120px;
            height: 120px;
            animation: breathe 2.4s ease-in-out infinite;
        }

        @keyframes breathe {
            50% {
                transform: scale(0.94);
                opacity: 0.85;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            img {
                animation: none;
            }
        }

        .title {
            font-size: 15px;
            font-weight: 600;
        }

        .message {
            min-height: 2.6em;
            padding: 0 18px;
            font-size: 12px;
            text-align: center;
            color: color-mix(in srgb, var(--fg) 70%, transparent);
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="../icon.png" alt="" draggable="false" />
        <div class="title">Starting Evecord…</div>
        <div class="message" role="status"></div>
    </div>
    <script>
        const message = document.querySelector(".message");
        EvecordSplash.onMessage(text => (message.textContent = text));
    </script>
</body>
</html>
