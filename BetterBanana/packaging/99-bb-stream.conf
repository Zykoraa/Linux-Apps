# Dedicated BetterBanana stream bus (optional but recommended if you share your
# screen on Discord).
#
# The name deliberately does NOT start with "bb_". The GUI hides bb_-prefixed
# sinks from the bus device dropdowns (they would be routing loops), and it
# clears any bus assignment it cannot find in that list -- so a bb_-prefixed
# stream sink gets silently unassigned the next time you open the mixer.
#
# Point a spare output bus at this sink and route the strips you want streamed
# to it, leaving the AUX strip off it:
#
#     bb-ctl route out A3 betterbanana_stream
#     bb-ctl strip 1 bus A3 1
#
# bb-stream-guard then feeds A3 -- and only A3 -- to Discord's capture, so the
# people in your call never hear themselves echoed back through your stream.
#
# The description is deliberately shouty. This sink appears in every app's
# output-device list, right next to "BetterBanana AUX", and picking it by
# mistake is silent and confusing: audio played into it is inaudible (nothing
# routes it back to your speakers), and if that app is Discord, everyone in
# the call gets echoed into your stream. It is a capture source, not an
# output you select.
#
# session.suspend-timeout-seconds = 0 is load-bearing. A null sink with nothing
# playing gets suspended as idle, which tears down BetterBanana's output node for
# that bus, and the stream silently loses its audio until something restarts the
# chain.
context.objects = [
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "betterbanana_stream"
            node.description = "BetterBanana Stream Bus (capture only - do not select)"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            session.suspend-timeout-seconds = 0
        }
    }
]
